name: Publish to npm

# Publishes the package to the public npm registry (https://registry.npmjs.org).
#
# Triggers:
#   - Automatically when you publish a GitHub Release.
#   - Manually via the "Run workflow" button (Actions tab) with a dry-run option.
#
# Flow:
#   build   -> always runs tests + build (and a publish --dry-run preview when
#              requested). No secrets, no approval.
#   publish -> gated behind the `npm-production` environment. GitHub pauses here
#              and waits for a MANUAL APPROVAL from a required reviewer before it
#              runs. If the approval is rejected (or times out), the publish job
#              never runs and the pipeline stops - nothing is published.
#
# One-time setup (all in the GitHub UI + npmjs.com — no terminal needed):
#   1. Trusted publisher (OIDC, no token): on npmjs.com open the package ->
#      Settings -> Trusted Publisher -> GitHub Actions, and set
#        Organization/User: dan1510123
#        Repository:        CopilotOffice
#        Workflow filename: npm-publish.yml
#        Environment:       npm-production   (optional but recommended)
#      This lets the publish job authenticate via its OIDC identity — no npm
#      token stored anywhere, and no 2FA/OTP prompt (which is what previously
#      failed CI with EOTP).
#   2. Approval gate: Settings -> Environments -> New environment named
#      `npm-production`. Open it, enable "Required reviewers", and add yourself
#      (and/or a team). This environment is what forces the manual approval
#      before the publish job runs.
#   3. Publish a Release (Releases -> Draft a new release -> tag like v2.3.0 ->
#      Publish release). The build job runs, then the publish job waits for your
#      approval before publishing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in --dry-run mode (no actual publish, no approval)"
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag (normalized): $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump package.json or fix the tag."
            exit 1
          fi

      - name: Publish preview (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --no-provenance --dry-run

  publish:
    name: Publish to npm
    needs: build
    # Skip the real publish for dry runs; only publish for a release or a
    # non-dry-run manual dispatch.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    # Requiring this protected environment is what pauses the run for a MANUAL
    # APPROVAL. If the reviewer rejects it, this job never runs and the pipeline
    # stops without publishing.
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/copilotoffice
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 may ship an
      # older npm. Upgrade so `npm publish` uses the OIDC identity (no token,
      # no 2FA/OTP) once a trusted publisher is configured for this package.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        # OIDC trusted publishing authenticates without a token. Provenance is
        # disabled because npm only allows provenance from PUBLIC source repos,
        # and this repository is private (E422 "Unsupported ... visibility:
        # private"). Make the repo public and re-add --provenance if you want
        # signed provenance attestations.
        run: npm publish --access public --no-provenance

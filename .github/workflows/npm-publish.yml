name: Publish to npm

# Publishes the package to the public npm registry (https://registry.npmjs.org).
#
# Triggers:
#   - Automatically when you publish a GitHub Release.
#   - Manually via the "Run workflow" button (Actions tab) with a dry-run option.
#
# One-time setup (in the GitHub UI — no terminal needed):
#   1. Create an npm "Automation" access token at
#      https://www.npmjs.com/settings/<your-user>/tokens (works with 2FA).
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New repository
#      secret named NPM_TOKEN with that token as the value.
#   3. Publish a Release (Releases -> Draft a new release -> choose/create a tag
#      like v2.3.0 -> Publish release). This workflow runs and publishes.
#
# Tip: keep the git tag / release version in sync with package.json "version".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in --dry-run mode (no actual publish)"
        type: boolean
        default: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag (normalized): $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG_VERSION). Bump package.json or fix the tag."
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
